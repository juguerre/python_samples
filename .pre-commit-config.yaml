repos:
  - repo: local
    hooks:
      - id: generate-stubs
        name: Generate FluentPipe protocol stubs
        entry: ./scripts/run-hook.sh uv run scripts/gen_stubs.py src/samples/fluent_pipeline.py src/samples/protocol_stubs.py
        language: system
        files: ^src/samples/fluent_pipeline\.py$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
